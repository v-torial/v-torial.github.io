<!DOCTYPE html>
<html lang="en" class="hide-scrollbar">
  <link rel="stylesheet" href="style.css">

  <head>
    <meta charset="utf-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&family=Squada+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">

    <meta name="viewport" content="width=device-width, initial-scale=1"> <!--bootstrapping-->
    <title>
        Victoria Lee
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">

    <style>
        :root {
      --font-token-primary: "Nunito Sans", sans-serif;
      --font-token-display: "Squada One", sans-serif;
    }
    html, body {
              margin: 0;
              padding: 0;
              font-family: var(--font-token-primary);
          }
    </style>
  </head>

  <body>
    <main>
        <ul class="navbar" id="NavBar">
            <a href="/" class="logo">
            Leevictoriin.
            </a>
            
            <div class="right-button-content">
                <button-secondary>Resume</button-secondary>
                <button-primary>LinkedIn</button-primary>
            </div>
            <a href="javascript:void(0);" class="icon" style="margin-left:auto;" onclick="myFunction()">
                <i class="fa fa-bars fa-2x"></i>
            </a>
        </ul>

        <div class="container">
            <div class="row" style="margin: 10% 0% 10% 0%;">
                <div class="col">
                <img src="images/avatar.png" alt="avatar" class="circle-crop">
                </div>
                <div class="col">
                    <h1>Hello, world!</h1>
                </div>
            </div>
        </div>

    </main>

     <footer>&#169; LeeVictoriin 2026.
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
    <script>
    function myFunction() {
      var x = document.getElementById("NavBar");
      if (x.className === "navbar") {
        x.className += "responsive";
      } else {
        x.className = "navbar";
      }
    }
    </script>

  </body>

</html>
